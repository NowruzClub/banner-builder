<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio BIDAR Live Banner</title>

  <!-- Config MUST load before anything else -->
  <script src="config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- QR Code generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PNG export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ── Original ChatGPT design – untouched ── */
    :root {
      --bg-dark:  #021327;
      --bg-dark-2:#062746;
      --accent:   #f5b52d;
      --cyan:     #3cc7de;
      --cyan-soft:#77e5f7;
      --text:     #ffffff;
      --muted:    #c9d8e6;
      --border:   rgba(255,255,255,0.18);
      --shadow:   0 12px 30px rgba(0,0,0,0.25);
      --radius:   28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #eef2f6;
      font-family: 'Vazirmatn', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .poster {
      width: 850px;
      max-width: 100%;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    /* HERO */
    .hero {
      position: relative;
      padding: 28px 28px 20px;
      background:
        radial-gradient(circle at 70% 28%, rgba(40,160,255,0.35), transparent 30%),
        radial-gradient(circle at 72% 30%, rgba(80,200,255,0.18), transparent 18%),
        linear-gradient(135deg, #021327 0%, #04254a 100%);
      color: var(--text);
      min-height: 760px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -80px;
      width: 220px;
      height: 220px;
      background: var(--accent);
      border-radius: 50%;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      direction: ltr;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(180deg, #3cd6ea, #f5b52d);
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 800;
      color: #07233d;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 14px;
      color: #8ee9f7;
    }

    .telegram-pill {
      direction: rtl;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(4px);
      font-size: 14px;
      color: #dfefff;
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      margin-top: 34px;
      direction: ltr;
    }

    .hero-copy {
      direction: rtl;
      padding-top: 80px;
    }

    .hero-copy h2 {
      margin: 0;
      font-size: 62px;
      line-height: 1.25;
      font-weight: 800;
      color: #fff;
    }

    .hero-copy .accent { color: var(--accent); }

    .hero-copy .line {
      width: 54px;
      height: 4px;
      background: #3fd6e8;
      border-radius: 999px;
      margin: 28px 0;
    }

    .hero-copy p {
      margin: 0;
      color: #d6e7f4;
      font-size: 28px;
      line-height: 2;
      font-weight: 500;
    }

    .telegram-card {
      margin-top: 34px;
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      border: 2px solid rgba(75,220,255,0.6);
      padding: 20px;
      background: rgba(9,33,58,0.9);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .telegram-card h3 {
      margin: 0;
      color: #74f2ff;
      font-size: 34px;
      font-weight: 800;
    }

    .telegram-card p {
      margin: 8px 0 16px;
      font-size: 20px;
      color: #dbe9f6;
      line-height: 1.7;
    }

    .telegram-link {
      display: inline-block;
      direction: ltr;
      background: #10253f;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 24px;
      font-weight: 700;
      text-decoration: none;
    }

    .hero-visual {
      direction: rtl;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .mic-ring {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(60,200,255,0.18) 0%, rgba(60,200,255,0.08) 40%, transparent 70%),
        radial-gradient(circle, transparent 58%, rgba(70,180,255,0.2) 60%, transparent 62%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic { font-size: 120px; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.45)); }

    .live-strip {
      margin-top: 14px;
      display: flex;
      align-items: center;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      font-size: 22px;
      font-weight: 700;
    }

    .live-badge {
      background: #e53935;
      color: #fff;
      padding: 10px 18px;
      direction: ltr;
    }

    .live-text {
      background: linear-gradient(90deg, #3cc7de, #65d4c0);
      color: #fff;
      padding: 10px 18px;
    }

    /* ── Guest photo (new) ── */
    .guest-block {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .guest-photo-link {
      display: block;
      border-radius: 50%;
      text-decoration: none;
      position: relative;
      cursor: default;
    }

    .guest-photo-link[href] { cursor: pointer; }

    .guest-photo-link[href]:hover .guest-photo-wrap {
      box-shadow: 0 0 0 3px var(--accent), 0 0 0 6px rgba(245,181,45,.25), 0 8px 24px rgba(0,0,0,.5);
    }

    .guest-photo-link[href]::after {
      content: '↗';
      position: absolute;
      bottom: 2px; right: 2px;
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 50%;
      font-size: .75rem;
      color: #021327;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }

    .guest-photo-link[href]:hover::after { display: flex; }

    .guest-photo-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--accent), 0 6px 20px rgba(0,0,0,.5);
      overflow: hidden;
      transition: box-shadow .25s;
    }

    .guest-photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .guest-photo-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #062746, #021327);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    .guest-name {
      font-size: 18px;
      font-weight: 700;
      color: #74f2ff;
      text-align: center;
    }

    .guest-org-text {
      font-size: 13px;
      color: #8ee9f7;
      text-align: center;
      line-height: 1.6;
    }

    .schedule {
      margin-top: 16px;
      width: 100%;
      background: rgba(7,22,39,0.92);
      border-radius: 22px;
      padding: 18px 20px;
      color: #fff;
    }

    .schedule h4 {
      margin: 0 0 16px;
      color: #f4c34f;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .schedule-item {
      border-left: 1px dashed rgba(255,255,255,0.15);
      padding: 0 8px;
    }

    .schedule-item:last-child { border-left: none; }
    .schedule-item .icon { font-size: 26px; margin-bottom: 6px; }
    .schedule-item .label { color: #9edbf1; font-size: 15px; font-weight: 700; }
    .schedule-item .value { margin-top: 6px; font-size: 16px; color: #fff; }

    /* WHITE SECTIONS */
    .section {
      background: #f9fbfd;
      padding: 24px 28px;
      border-top: 1px solid #e4edf5;
    }

    .card {
      background: #fff;
      border: 1px solid #d7e4ee;
      border-radius: 24px;
      padding: 24px;
    }

    .section-title {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      color: #183650;
      margin: 0 0 24px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      text-align: center;
    }

    .feature {
      padding: 10px 12px;
      border-left: 1px dashed #d8e5ef;
    }

    .feature:last-child { border-left: none; }
    .feature .icon { font-size: 44px; color: #1ea7c5; }

    .feature h5 {
      margin: 8px 0;
      font-size: 24px;
      color: #163550;
    }

    .feature p {
      margin: 0;
      font-size: 18px;
      line-height: 1.8;
      color: #536c80;
    }

    .platforms {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 24px;
      align-items: center;
    }

    .platform-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 18px;
      margin-top: 16px;
      font-size: 18px;
      color: #39566f;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .platform-item span:first-child { font-size: 42px; }

    /* QR Code */
    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #qr-code canvas,
    #qr-code img {
      border: 6px solid #fff;
      outline: 1px solid #d7e4ee;
      display: block;
    }

    .qr-label {
      font-size: 16px;
      color: #567086;
      text-align: center;
    }

    /* FOOTER */
    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      direction: ltr;
    }

    .footer-left,
    .footer-right {
      padding: 28px;
      color: #fff;
    }

    .footer-left {
      background: linear-gradient(135deg, #021327, #062746);
      direction: rtl;
    }

    .footer-right {
      background: linear-gradient(135deg, #1f9fb4, #5bcfc7);
      direction: rtl;
      text-align: center;
    }

    .footer h4 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .footer p {
      margin: 0;
      font-size: 22px;
      line-height: 1.8;
    }

    .socials {
      margin-top: 14px;
      font-size: 22px;
      color: #c9dff1;
    }

    /* ── Export button (outside poster) ── */
    #export-btn {
      margin-top: 24px;
      background: linear-gradient(135deg, #1f9fb4, #3cc7de);
      color: #fff;
      border: none;
      padding: 13px 36px;
      border-radius: 40px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(60,199,222,0.4);
      transition: transform .15s, box-shadow .15s;
    }

    #export-btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(60,199,222,0.5); }
    #export-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    #export-note {
      margin-top: 8px;
      font-size: .8rem;
      color: #888;
      font-family: sans-serif;
    }

    @media (max-width: 900px) {
      body { padding: 0; }
      .poster { width: 100%; }
      .hero-grid,
      .features,
      .platforms,
      .footer { grid-template-columns: 1fr; }
      .hero-copy h2 { font-size: 42px; }
      .hero-copy p  { font-size: 22px; }
    }
  </style>
</head>

<body>

  <div class="poster" id="poster">

    <!-- ════════════════ HERO ════════════════ -->
    <section class="hero">

      <div class="topbar">
        <div class="brand">
          <div class="brand-logo" id="logo-letter"></div>
          <div>
            <h1 id="site-url"></h1>
            <p  id="site-tagline"></p>
          </div>
        </div>
        <div class="telegram-pill">🔔 <span id="live-badge-label"></span></div>
      </div>

      <div class="hero-grid">

        <!-- Left: copy -->
        <div class="hero-copy">
          <h2>
            <span id="hero-line1"></span><br>
            <span class="accent" id="hero-line-accent"></span><br>
            <span id="hero-line2"></span>
          </h2>
          <div class="line"></div>
          <p id="hero-desc"></p>

          <div class="telegram-card">
            <h3 id="cta-join-title"></h3>
            <p  id="cta-join-subtext"></p>
            <a  id="telegram-link" class="telegram-link" target="_blank" rel="noopener"></a>
          </div>
        </div>

        <!-- Right: visual -->
        <div class="hero-visual">

          <div class="mic-ring">
            <div class="mic">🎙️</div>
          </div>

          <div class="live-strip">
            <div class="live-badge">LIVE</div>
            <div class="live-text" id="live-strip-label"></div>
          </div>

          <!-- Guest photo block -->
          <div class="guest-block" id="guest-block">
            <!-- Rendered by JS -->
          </div>

          <div class="schedule">
            <h4 id="schedule-title"></h4>
            <div class="schedule-grid" id="schedule-grid">
              <!-- Rendered by JS -->
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ════════════════ FEATURES ════════════════ -->
    <section class="section">
      <div class="card">
        <h3 class="section-title" id="features-title"></h3>
        <div class="features" id="features-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- ════════════════ PLATFORMS ════════════════ -->
    <section class="section">
      <div class="card platforms">
        <div>
          <h3 class="section-title" style="text-align:right; margin-bottom:8px;" id="platforms-title"></h3>
          <p style="margin:0; font-size:20px; color:#5c7488;" id="platforms-subtext"></p>
          <div class="platform-icons" id="platforms-grid">
            <!-- Rendered by JS -->
          </div>
        </div>
        <div class="qr-wrap">
          <div id="qr-code"></div>
          <div class="qr-label" id="qr-label"></div>
        </div>
      </div>
    </section>

    <!-- ════════════════ FOOTER ════════════════ -->
    <footer class="footer">
      <div class="footer-left">
        <h4 id="follow-us-title"></h4>
        <p  id="social-handle"></p>
        <div class="socials" id="socials-line"></div>
      </div>
      <div class="footer-right">
        <h4 id="bell-title"></h4>
        <p  id="bell-subtext"></p>
      </div>
    </footer>

  </div><!-- /.poster -->

  <button id="export-btn" onclick="exportPNG()">📥 دانلود PNG</button>
  <p id="export-note">کلیک کنید تا تصویر با کیفیت بالا دانلود شود</p>

  <!-- ════════════════ RENDER SCRIPT ════════════════ -->
  <script>
    const esc = s => String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function set(id, val) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = val;
    }

    /* ── Simple text fields ── */
    set('logo-letter',      esc(CONFIG.logoLetter));
    set('site-url',         esc(CONFIG.siteUrl));
    set('site-tagline',     esc(CONFIG.siteTagline));
    set('live-badge-label', esc(CONFIG.liveBadgeLabel));
    set('live-strip-label', esc(CONFIG.liveBadgeLabel));
    set('hero-line1',       esc(CONFIG.heroLine1));
    set('hero-line-accent', esc(CONFIG.heroLineAccent));
    set('hero-line2',       esc(CONFIG.heroLine2));
    set('hero-desc',        CONFIG.heroDesc.map(esc).join('<br>'));
    set('cta-join-title',   esc(CONFIG.ctaJoinTitle));
    set('cta-join-subtext', esc(CONFIG.ctaJoinSubtext));
    set('schedule-title',   esc(CONFIG.scheduleTitle));
    set('features-title',   esc(CONFIG.featuresSectionTitle));
    set('platforms-title',  esc(CONFIG.platformsSectionTitle));
    set('platforms-subtext',esc(CONFIG.platformsSectionSubtext));
    set('qr-label',         esc(CONFIG.qrLabel));
    set('follow-us-title',  esc(CONFIG.followUsTitle));
    set('social-handle',    esc(CONFIG.socialHandle));
    set('socials-line',     esc(CONFIG.socialsLine));
    set('bell-title',       esc(CONFIG.bellTitle));
    set('bell-subtext',     esc(CONFIG.bellSubtext));

    /* ── Telegram link ── */
    const tgEl = document.getElementById('telegram-link');
    tgEl.href        = CONFIG.telegramLiveUrl;
    tgEl.textContent = CONFIG.telegramHandle;

    /* ── Guest photo ─────────────────────────────────────────────
       Priority: speaker.png → CONFIG.guestPhotoUrl → placeholder  */
    function buildGuestBlock() {
      const fallback = CONFIG.guestPhotoUrl
        ? `this.onerror=function(){this.onerror=null;this.parentNode.innerHTML='<div class=\\"guest-photo-placeholder\\">👤</div>';};this.src='${CONFIG.guestPhotoUrl}';`
        : `this.onerror=null;this.parentNode.innerHTML='<div class=\\"guest-photo-placeholder\\">👤</div>';`;

      const img  = `<img src="speaker.png" alt="${esc(CONFIG.guestName)}" onerror="${fallback}" />`;
      const href = CONFIG.guestUrl
        ? ` href="${esc(CONFIG.guestUrl)}" target="_blank" rel="noopener"`
        : '';

      document.getElementById('guest-block').innerHTML = `
        <a class="guest-photo-link"${href}>
          <div class="guest-photo-wrap">${img}</div>
        </a>
        <div class="guest-name">${esc(CONFIG.guestName)}</div>
        <div class="guest-org-text">${esc(CONFIG.guestOrg)}</div>
      `;
    }
    buildGuestBlock();

    /* ── Schedule items ── */
    document.getElementById('schedule-grid').innerHTML =
      CONFIG.scheduleItems.map(item => `
        <div class="schedule-item">
          <div class="icon">${item.icon}</div>
          <div class="label">${esc(item.label)}</div>
          <div class="value">${esc(item.value)}</div>
        </div>`).join('');

    /* ── Feature cards ── */
    document.getElementById('features-grid').innerHTML =
      CONFIG.features.map(f => `
        <div class="feature">
          <div class="icon">${f.icon}</div>
          <h5>${esc(f.title)}</h5>
          <p>${esc(f.desc)}</p>
        </div>`).join('');

    /* ── Platform icons ── */
    document.getElementById('platforms-grid').innerHTML =
      CONFIG.platforms.map(p => `
        <div class="platform-item">
          <span>${p.icon}</span>
          <span>${esc(p.label)}</span>
        </div>`).join('');

    /* ── QR Code ── */
    new QRCode(document.getElementById('qr-code'), {
      text:         CONFIG.qrUrl,
      width:        100,
      height:       100,
      colorDark:    '#021327',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>

  <!-- ════════════════ EXPORT SCRIPT ════════════════ -->
  <script>
    async function exportPNG() {
      const btn  = document.getElementById('export-btn');
      const note = document.getElementById('export-note');

      btn.disabled    = true;
      btn.textContent = '⏳ در حال ساخت تصویر…';
      note.textContent = 'لطفاً صبر کنید…';

      try {
        const canvas = await html2canvas(document.getElementById('poster'), {
          scale:           3,
          useCORS:         true,
          allowTaint:      false,
          backgroundColor: '#ffffff',
          logging:         false,
        });

        const ep   = CONFIG.episodeNumber || 'ep';
        const date = (CONFIG.episodeDate || '').replace(/\s/g, '-');
        const link = document.createElement('a');
        link.download = `BIDAR-ep${ep}-${date}.png`;
        link.href     = canvas.toDataURL('image/png');
        link.click();

        note.textContent = `✅ دانلود شد: BIDAR-ep${ep}-${date}.png`;
      } catch (err) {
        console.error(err);
        note.textContent = '❌ خطا – لطفاً دوباره امتحان کنید.';
      } finally {
        btn.disabled    = false;
        btn.textContent = '📥 دانلود PNG';
      }
    }
  </script>

</body>
</html>
